server {
    listen 8080;

    location / {
        root /app;
        try_files $uri $uri/ /index.html;
    }

    location = /runtime-config.js {
        root /app;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass $API_URL;
        proxy_pass_request_headers on;

        # Without these, an inbound X-Forwarded-For passes through untouched and the chain length
        # differs per topology, which is exactly what makes the backend's ForwardLimit misbehave.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
