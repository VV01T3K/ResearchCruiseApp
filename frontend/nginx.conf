# Per-client limit for the Sentry proxy. Generous because campus NAT can put
# many users behind one address; one user sends a few requests per minute, in short bursts.
limit_req_zone $binary_remote_addr zone=sentry_proxy:10m rate=10r/s;

server {
    listen 8080;

    location / {
        root /app;
        try_files $uri $uri/ /index.html;
    }

    location = /runtime-config.js {
        root /app;
        add_header Cache-Control "no-store";
    }

    # Trusted proxies and the Sentry proxy, generated at startup by
    # docker-entrypoint.d/90-runtime-config.sh. The wildcard lets nginx start without it.
    include /etc/nginx/runtime*.conf;

    location /api/ {
        proxy_pass $API_URL;
        proxy_pass_request_headers on;
    }
}
