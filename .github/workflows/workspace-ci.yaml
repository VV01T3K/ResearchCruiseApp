name: Workspace CI

on:
  pull_request:
    branches: [main, staging]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-workspace
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: frontend
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Install workspace dependencies
        run: vp install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: bun audit --audit-level=high
      - name: Record runner environment
        run: |
          mkdir -p backend/artifacts
          uname -a > backend/artifacts/runner-environment.txt
          lscpu >> backend/artifacts/runner-environment.txt
          cat /etc/os-release >> backend/artifacts/runner-environment.txt
          dotnet --info >> backend/artifacts/runner-environment.txt
          node --version >> backend/artifacts/runner-environment.txt
          bun --version >> backend/artifacts/runner-environment.txt
      - name: Check workspace
        shell: bash
        run: |
          mkdir -p backend/artifacts
          vp run check 2>&1 | tee backend/artifacts/workspace-check.log
      - name: Summarize suites
        if: always()
        run: python3 scripts/summarize-checks.py >> "$GITHUB_STEP_SUMMARY"
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workspace-diagnostics
          path: backend/artifacts/
          retention-days: 14
          if-no-files-found: error
