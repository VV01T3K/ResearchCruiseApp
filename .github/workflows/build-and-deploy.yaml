name: 'Gate proof: build-and-deploy.yaml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    name: Validate workspace
    uses: ./.github/workflows/workspace-ci.yaml
    permissions:
      contents: read
  build:
    needs: workspace
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
        - component: frontend
          context: .
          dockerfile: frontend/Dockerfile
          build-args: 'APP_ENVIRONMENT=production

            SENTRY_RELEASE=research-cruise-app-frontend@${{ github.sha }}

            '
        - component: backend
          context: backend
          dockerfile: backend/Dockerfile
          build-args: 'APP_ENVIRONMENT=production

            SENTRY_RELEASE=research-cruise-app-backend@${{ github.sha }}

            '
    steps:
    - name: Publication/deployment sentinel (must be skipped)
      run: 'echo "ERROR: downstream job ran despite failed workspace gate"; exit 1'
'on':
  push:
    branches:
    - audit/pr430-failed-gate
permissions:
  contents: read
