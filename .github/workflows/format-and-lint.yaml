name: Format & lint checks

on:
  push:
    branches-ignore: [staging, main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: true

jobs:
  javascript-audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Audit JavaScript dependencies
        run: bun audit --audit-level=high

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for frontend changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/changes.sh frontend

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          node-version-file: .node-version
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run checks
        run: vp check

      - name: Check root formatting
        working-directory: .
        run: vp run fmt --check

      - name: Run unit tests
        if: steps.changes.outputs.skip != 'true'
        run: vp run test:unit

      - name: Check generated API
        if: steps.changes.outputs.skip != 'true'
        run: |
          vp run gen
          git diff --exit-code -- src/api/generated
          test -z "$(git ls-files --others --exclude-standard -- src/api/generated)"

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for backend changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/changes.sh backend

      - name: Setup .NET
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Vite+
        if: steps.changes.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: backend
          version-file: ../frontend/package.json
          node-version-file: ../frontend/.node-version
          cache: true

      - name: Restore .NET tools
        if: steps.changes.outputs.skip != 'true'
        run: dotnet tool restore

      - name: Restore dependencies
        if: steps.changes.outputs.skip != 'true'
        run: dotnet restore ResearchCruiseApp.slnx

      - name: Run checks
        if: steps.changes.outputs.skip != 'true'
        run: vp run check

      - name: Check OpenAPI spec
        if: steps.changes.outputs.skip != 'true'
        run: git diff --exit-code -- '*openapi*'

      - name: Run tests
        if: steps.changes.outputs.skip != 'true'
        run: vp run test
