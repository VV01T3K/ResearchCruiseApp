name: Format & lint checks

on:
  push:
    paths-ignore:
      - docs
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: frontend
          node-version-file: .node-version
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Audit JavaScript dependencies
        working-directory: .
        run: bun audit --audit-level=high

      - name: Run checks
        run: vp check

      - name: Check generated API
        run: |
          vp run gen
          git diff --exit-code -- src/api/generated
          test -z "$(git ls-files --others --exclude-standard -- src/api/generated)"

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: backend
          version: "0.1.16"
          node-version-file: ../frontend/.node-version
          cache: true

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore ResearchCruiseApp.sln --locked-mode --force -p:CI=true

      - name: Run checks
        run: vp run check

      - name: Check OpenAPI spec
        run: git diff --exit-code -- '*openapi*'

      - name: Run tests
        run: vp run test
