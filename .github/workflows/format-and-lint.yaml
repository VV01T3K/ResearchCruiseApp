name: Format & lint checks

on:
  push:
    # staging and main run these checks through their deploy workflows.
    branches-ignore: [staging, main]
    paths-ignore:
      - docs
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: true

jobs:
  javascript-audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Audit JavaScript dependencies
        run: bun audit --audit-level=high

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: frontend
          node-version-file: .node-version
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run checks
        run: vp check

      - name: Check types
        run: vp run type

      - name: Run unit tests
        run: vp test run

      - name: Check generated API
        run: |
          vp run gen
          git diff --exit-code -- src/api/generated
          test -z "$(git ls-files --others --exclude-standard -- src/api/generated)"

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: backend
          version-file: ../frontend/package.json
          node-version-file: ../frontend/.node-version
          cache: true

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore ResearchCruiseApp.slnx

      - name: Run checks
        run: vp run check

      - name: Check OpenAPI spec
        run: |
          git diff --exit-code -- '*openapi*'
          test -z "$(git ls-files --others --exclude-standard -- '*openapi*')"

      - name: Run tests
        run: vp run test
