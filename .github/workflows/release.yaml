name: Release
run-name: Release ${{ inputs.bump }} from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      ref:
        description: Commit to release (staging or the SHA of a staging commit)
        type: string
        default: staging
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      previous: ${{ steps.target.outputs.previous }}
      version: ${{ steps.target.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve commit and version
        id: target
        env:
          REF: ${{ inputs.ref }}
          BUMP: ${{ inputs.bump }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ $GITHUB_REF == refs/heads/staging ]] || fail "Run this workflow from staging."
          sha=$(git rev-parse --verify --quiet "origin/$REF^{commit}" || git rev-parse --verify --quiet "$REF^{commit}") \
            || fail "Unknown ref: $REF"
          previous=$(.github/scripts/version.sh latest)
          version=$(.github/scripts/version.sh next "$BUMP")

          git merge-base --is-ancestor origin/main "$sha" || fail "main is not an ancestor of $sha, so it cannot be fast-forwarded."
          git merge-base --is-ancestor "$previous" "$sha" || fail "$previous is not an ancestor of $sha."
          [[ $sha != "$(git rev-parse origin/main)" ]] || fail "$sha is already released."
          git merge-base --is-ancestor "$sha" origin/staging || fail "$REF is not a commit on staging."

          {
            echo "sha=$sha"
            echo "previous=$previous"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for CI on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: .github/scripts/check-ci.sh "$SHA"

      - name: Summarize
        env:
          BUMP: ${{ inputs.bump }}
          SHA: ${{ steps.target.outputs.sha }}
          PREVIOUS: ${{ steps.target.outputs.previous }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          range="$PREVIOUS..$SHA"
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:' <<< "$(git log --format=%B "$range")"; then
            hint='major'
          elif grep -qE '^feat(\(|:)' <<< "$(git log --format=%s "$range")"; then
            hint='minor'
          else
            hint='patch'
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "## v$VERSION"
            echo
            echo "- Commit: [\`${SHA::8}\`]($url/commit/$SHA)"
            echo "- Bump: $BUMP from $PREVIOUS (Conventional Commits suggest $hint)"
            echo "- Changes: [$PREVIOUS...${SHA::8}]($url/compare/$PREVIOUS...$SHA)"
            echo
            echo "<details><summary>$(git rev-list --count "$range") commits</summary>"
            echo
            git log --format='- %s' "$range"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release v${{ needs.plan.outputs.version }}
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.plan.outputs.version }}
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.VERSION_RELEASE_DEPLOYMENT_KEY }}

      # The approval may come much later than the plan, so check the commit again just before the push.
      - name: Check the commit again
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          if [[ $(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}") == "$SHA" && $(git rev-parse origin/main) == "$SHA" ]]; then
            echo "v$VERSION is already tagged and on main; publishing only its GitHub Release."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge-base --is-ancestor origin/main "$SHA" || fail "main moved; plan the release again."
          git merge-base --is-ancestor "$SHA" origin/staging || fail "$SHA is no longer on staging."
          .github/scripts/check-ci.sh "$SHA"

      # Deploy-key pushes bypass the rulesets and, unlike GITHUB_TOKEN ones, trigger the tag's image build.
      - name: Tag and fast-forward main
        if: steps.current.outputs.pushed != 'true'
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "v$VERSION" "$SHA"
          git push --atomic origin "$SHA:refs/heads/main" "refs/tags/v$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes --notes-start-tag "$PREVIOUS"
