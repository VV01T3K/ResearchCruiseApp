name: Release
run-name: Release ${{ inputs.bump }} from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      ref:
        description: Commit to release (staging, the SHA of a staging commit, or a hotfix/* branch)
        type: string
        default: staging
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      branch: ${{ steps.target.outputs.branch }}
      staging: ${{ steps.target.outputs.staging }}
      previous: ${{ steps.target.outputs.previous }}
      version: ${{ steps.target.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve commit and version
        id: target
        env:
          REF: ${{ inputs.ref }}
          BUMP: ${{ inputs.bump }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ $GITHUB_REF == refs/heads/staging ]] || fail "Run this workflow from staging."
          sha=$(git rev-parse --verify --quiet "origin/$REF^{commit}" || git rev-parse --verify --quiet "$REF^{commit}") \
            || fail "Unknown ref: $REF"
          previous=$(.github/scripts/version.sh latest)
          version=$(.github/scripts/version.sh next "$BUMP")

          git merge-base --is-ancestor origin/main "$sha" || fail "main is not an ancestor of $sha, so it cannot be fast-forwarded."
          git merge-base --is-ancestor "$previous" "$sha" || fail "$previous is not an ancestor of $sha."
          [[ $sha != "$(git rev-parse origin/main)" ]] || fail "$sha is already released."
          if git merge-base --is-ancestor "$sha" origin/staging; then
            branch=staging
          elif [[ $REF == hotfix/* ]]; then
            branch=$REF
            [[ $BUMP == patch ]] || fail "A hotfix must be a patch release."
            git merge-tree --write-tree origin/staging "$sha" > /dev/null \
              || fail "$REF conflicts with staging. Ship the fix as a pull request into staging and release it from there."
          else
            fail "$REF is not a commit on staging or a hotfix/* branch."
          fi
          git cat-file -e "$sha:.github/workflows/build-production.yaml" 2> /dev/null \
            || fail "$sha predates tag-based releases (it has no build-production.yaml); release a later staging commit."

          {
            echo "sha=$sha"
            echo "branch=$branch"
            echo "staging=$(git rev-parse origin/staging)"
            echo "previous=$previous"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for CI on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: .github/scripts/check-ci.sh "$SHA" "$BRANCH"

      - name: Summarize
        env:
          BUMP: ${{ inputs.bump }}
          SHA: ${{ steps.target.outputs.sha }}
          BRANCH: ${{ steps.target.outputs.branch }}
          STAGING: ${{ steps.target.outputs.staging }}
          PREVIOUS: ${{ steps.target.outputs.previous }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          range="$PREVIOUS..$SHA"
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:' <<< "$(git log --format=%B "$range")"; then
            hint='major'
          elif grep -qE '^feat(\(|:)' <<< "$(git log --format=%s "$range")"; then
            hint='minor'
          else
            hint='patch'
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "## v$VERSION"
            echo
            echo "- Commit: [\`${SHA::8}\`]($url/commit/$SHA)"
            [[ $BRANCH == staging ]] || echo "- Hotfix: \`$BRANCH\`, merged into \`staging\` at [\`${STAGING::8}\`]($url/commit/$STAGING) on release"
            echo "- Bump: $BUMP from $PREVIOUS (Conventional Commits suggest $hint)"
            echo "- Changes: [$PREVIOUS...${SHA::8}]($url/compare/$PREVIOUS...$SHA)"
            echo
            echo "<details><summary>$(git rev-list --count "$range") commits</summary>"
            echo
            git log --format='- %s' "$range"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release v${{ needs.plan.outputs.version }}
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.plan.outputs.version }}
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.VERSION_RELEASE_DEPLOYMENT_KEY }}

      # The approval may come much later than the plan, so check CI again before the push.
      - name: Check CI again
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [[ $(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}") == "$SHA" && $(git rev-parse origin/main) == "$SHA" ]] \
            && git merge-base --is-ancestor "$SHA" origin/staging; then
            echo "v$VERSION is already tagged and on main and staging; publishing only its GitHub Release."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          .github/scripts/check-ci.sh "$SHA" "$BRANCH"

      # Deploy-key pushes bypass the rulesets and, unlike GITHUB_TOKEN ones, trigger the tag's image build.
      - name: Tag and fast-forward main
        if: steps.current.outputs.pushed != 'true'
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          STAGING: ${{ needs.plan.outputs.staging }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          git fetch --quiet origin
          git merge-base --is-ancestor origin/main "$SHA" || fail "main moved; plan the release again."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          refs=("$SHA:refs/heads/main" "refs/tags/v$VERSION")
          if [[ $BRANCH == staging ]]; then
            git merge-base --is-ancestor "$SHA" origin/staging || fail "$SHA is no longer on staging."
          else
            [[ $(git rev-parse origin/staging) == "$STAGING" ]] || fail "staging moved; plan the release again."
            [[ $(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH") == "$SHA" ]] || fail "$BRANCH moved; plan the release again."
            tree=$(git merge-tree --write-tree origin/staging "$SHA") || fail "$BRANCH conflicts with staging."
            merge=$(git commit-tree "$tree" -p origin/staging -p "$SHA" -m "chore(release): merge hotfix v$VERSION into staging")
            refs+=("$merge:refs/heads/staging")
          fi
          git tag -a "v$VERSION" -m "v$VERSION" "$SHA"
          git push --atomic origin "${refs[@]}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes --notes-start-tag "$PREVIOUS"
