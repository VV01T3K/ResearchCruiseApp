name: Build images & publish Arcane staging

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths-ignore: ["docs/**", "**.md", ".gitignore", "docker/arcane/**"]
  pull_request:
    branches: [staging]
    paths-ignore: ["docs/**", "**.md", ".gitignore", "docker/arcane/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile
            build-args: |
              APP_ENVIRONMENT=staging
              SENTRY_RELEASE=research-cruise-app-frontend@${{ github.sha }}
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
            build-args: |
              APP_ENVIRONMENT=staging
              SENTRY_RELEASE=research-cruise-app-backend@${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: type=raw,value=staging

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Record the published digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$COMPONENT.digest"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.component }}
          path: ${{ matrix.component }}.digest

  publish-deployment:
    name: Publish verified images for Arcane
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging' && vars.ARCANE_STAGING_READY == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: staging
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: image-digests
          merge-multiple: true
      - name: Update pinned staging images
        run: python scripts/publish-arcane-images.py image-digests
      - name: Commit deployment for Arcane polling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docker/arcane/compose.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deploy): publish staging image digests"
            git push origin HEAD:staging
          fi
