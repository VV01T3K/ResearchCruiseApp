name: Build images & deploy to Arcane staging

on:
  push:
    branches: [staging]
    paths-ignore: ["docs/**", "**.md", ".gitignore"]
  pull_request:
    branches: [staging]
    paths-ignore: ["docs/**", "**.md", ".gitignore"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile
            build-args: |
              APP_ENVIRONMENT=staging
              SENTRY_RELEASE=research-cruise-app-frontend@${{ github.sha }}
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
            build-args: |
              APP_ENVIRONMENT=staging
              SENTRY_RELEASE=research-cruise-app-backend@${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  deploy:
    name: Update staging application services
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && vars.ARCANE_STAGING_READY == 'true'
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Pull and update backend and frontend
        env:
          ARCANE_URL: ${{ vars.ARCANE_URL }}
          ARCANE_ENVIRONMENT_ID: ${{ vars.ARCANE_ENVIRONMENT_ID }}
          ARCANE_PROJECT_ID: ${{ vars.ARCANE_PROJECT_ID }}
          ARCANE_API_KEY: ${{ secrets.ARCANE_API_KEY }}
        run: |
          : "${ARCANE_URL:?Set the HTTPS Arcane base URL}"
          : "${ARCANE_ENVIRONMENT_ID:?Set the Arcane environment ID}"
          : "${ARCANE_PROJECT_ID:?Set the Research Cruise project ID}"
          : "${ARCANE_API_KEY:?Set the deployment API key}"
          curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 15 --max-time 1100 \
            --header "X-Api-Key: $ARCANE_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"services":["backend","frontend"]}' \
            "${ARCANE_URL%/}/api/environments/${ARCANE_ENVIRONMENT_ID}/projects/${ARCANE_PROJECT_ID}/update-services" \
            | jq --exit-status '.success == true'
