name: Playwright Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          node-version-file: .node-version
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Playwright Browsers
        run: vp exec playwright install --with-deps chromium

      - name: Run Storybook tests
        run: vp run test:storybook

      - name: Run Playwright tests
        run: |
          seed=$((RANDOM * 32768 + RANDOM))
          echo "Playwright shuffle seed \`$seed\`: reproduce with \`vp run test:browser:shuffle $seed --workers=1\`" >> "$GITHUB_STEP_SUMMARY"
          vp run test:browser:shuffle "$seed"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
