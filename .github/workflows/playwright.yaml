name: Playwright Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      # Keep this version aligned with @playwright/test and the screenshot baselines.
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: frontend
          node-version-file: .node-version
          run-install: false
          cache: true

      - name: Install dependencies
        id: install
        run: vp install --frozen-lockfile

      - name: Run Storybook component and accessibility tests
        run: vp run test:storybook

      - name: Run Storybook visual tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vp run test:storybook:visual

      - name: Run Playwright tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vp run test

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: storybook-visual-results
          path: frontend/test-results/storybook-visual/
          retention-days: 7
