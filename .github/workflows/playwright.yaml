name: Playwright Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for browser-relevant changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            base=$(git rev-parse HEAD^1) || base=
          else
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/playwright.yaml/runs?branch=$GITHUB_REF_NAME&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || base=
            [[ -n $base ]] && git fetch -q --depth=1 origin "$base" || base=
          fi
          files=$([[ -n $base ]] && git diff --no-renames --name-only "$base" HEAD) || files=
          if [[ -n $files ]] && ! grep -qvE '^docs/|\.md$' <<< "$files" &&
            git diff --no-renames --diff-filter=D --quiet "$base" HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Browser tests skipped: only docs or Markdown changed since \`$base\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Vite+
        if: steps.changes.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          node-version-file: .node-version
          run-install: false
          cache: true

      - name: Install dependencies
        if: steps.changes.outputs.skip != 'true'
        run: vp install --frozen-lockfile

      - name: Install Playwright Browsers
        if: steps.changes.outputs.skip != 'true'
        run: vp exec playwright install --with-deps chromium

      - name: Run Storybook tests
        if: steps.changes.outputs.skip != 'true'
        run: vp run test:storybook

      - name: Run Playwright tests
        if: steps.changes.outputs.skip != 'true'
        run: |
          seed=$((RANDOM * 32768 + RANDOM))
          echo "Playwright shuffle seed \`$seed\`: reproduce with \`vp run test:browser:shuffle $seed --workers=1\`" >> "$GITHUB_STEP_SUMMARY"
          vp run test:browser:shuffle "$seed"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.changes.outputs.skip != 'true' }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
