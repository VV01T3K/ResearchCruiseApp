version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in bunfig.toml.
    cooldown:
      default-days: 7

  - package-ecosystem: nuget
    directory: /backend
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend
      - /backend/ResearchCruiseApp
      - /.devcontainer
      - /kubernetes/**
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /docker
    target-branch: staging
    schedule:
      interval: weekly
