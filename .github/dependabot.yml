version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend
      - /.devcontainer
    target-branch: staging
    schedule:
      interval: weekly
